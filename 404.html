<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Lexo Kuranin</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://followthequran.com/">
<script>
  // Send the visitor to the same page on the main domain.
  // ?lang=sq keeps the site in Albanian, the default language for this domain.
  location.replace('https://followthequran.com' + location.pathname + (location.search ? location.search + '&' : '?') + 'lang=sq' + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://followthequran.com/?lang=sq">
</head>
<body>
<p>Faqja është zhvendosur në <a href="https://followthequran.com/">followthequran.com</a>.</p>
</body>
</html>
